services:
  db:
    container_name: db
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: driveon
      POSTGRES_DB: driveon
      POSTGRES_USER: driveon
    volumes:
      - postgresql_data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U myuser -d db_prod
      interval: 5s
      retries: 10

  php:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  postgresql_data:
