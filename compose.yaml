services:
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: driveon
      POSTGRES_DB: driveon
      POSTGRES_USER: driveon
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driveon -d driveon"]
      interval: 5s
      timeout: 3s
      retries: 10

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  postgresql_data:
